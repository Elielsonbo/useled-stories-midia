name: Publicar story

on:
  schedule:
    # O GitHub atrasa os agendamentos de 1h30 a 4h (medido em 22–26/10).
    # Por isso disparamos bem antes e várias vezes. O script só publica a
    # partir de 1h antes do horário e dentro das janelas 8h–12h e 19h–23h.
    # Se o story já saiu nas últimas 3h, os disparos seguintes não fazem nada.
    # Horários em UTC (Brasília = UTC-3):
    - cron: "7 9,20 * * *"     # 6h07 e 17h07
    - cron: "52 9,20 * * *"    # 6h52 e 17h52
    - cron: "37 10,21 * * *"   # 7h37 e 18h37
    - cron: "22 11,22 * * *"   # 8h22 e 19h22
    - cron: "7 12,23 * * *"    # 9h07 e 20h07
    - cron: "52 12,23 * * *"   # 9h52 e 20h52
  workflow_dispatch:
    inputs:
      modo:
        description: "publicar = publica agora | teste = só confere token e fila"
        default: teste
        type: choice
        options: [teste, publicar]
      forcar:
        description: "publicar mesmo fora das janelas 8-12h / 19-23h"
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: publicar-story
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publicar próximo story da fila
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: "17841405843278969"
          MODO: ${{ github.event.inputs.modo || 'publicar' }}
          FORCAR: ${{ github.event.inputs.forcar == 'true' && '1' || '' }}
        run: python scripts/publicar_fila.py

      - name: Salvar status da fila
        if: always()
        run: |
          git config user.name "useled-bot"
          git config user.email "actions@users.noreply.github.com"
          git add fila/fila.json
          git diff --cached --quiet || (git commit -m "Fila: status após execução $(date -u +%FT%TZ)" && git pull --rebase && git push)
