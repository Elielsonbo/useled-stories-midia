<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
@font-face{font-family:Sora;font-weight:500;src:url(assets/fonts/sora-latin-500-normal.woff2)}
@font-face{font-family:Sora;font-weight:600;src:url(assets/fonts/sora-latin-600-normal.woff2)}
@font-face{font-family:"DM Sans";font-weight:400;src:url(assets/fonts/dm-sans-latin-400-normal.woff2)}
@font-face{font-family:"DM Sans";font-weight:500;src:url(assets/fonts/dm-sans-latin-500-normal.woff2)}
@font-face{font-family:Mono;font-weight:500;src:url(assets/fonts/jetbrains-mono-latin-500-normal.woff2)}
:root{--marfim:#F7F3EA;--carvao:#1F1F1C;--terracota:#C96A3A;--texto:#6E675D}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--marfim);color:var(--carvao);font-family:"DM Sans",sans-serif}
.fundo{position:absolute;inset:0;background:center/cover no-repeat;filter:blur(60px) saturate(1.1);opacity:.35;transform:scale(1.2)}
.veu{position:absolute;inset:0;background:linear-gradient(180deg,rgba(247,243,234,.75),rgba(247,243,234,.92))}
.pg{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;padding:150px 90px 170px}
.kicker{font-family:Mono;font-weight:500;font-size:30px;letter-spacing:.2em;color:var(--terracota);text-transform:uppercase}
h1{font-family:Sora;font-weight:600;font-size:66px;letter-spacing:-.02em;margin-top:16px;text-align:center;line-height:1.08}
.card{margin-top:56px;background:#fff;border-radius:34px;padding:22px;box-shadow:0 30px 70px rgba(31,31,28,.22);max-width:900px}
.card img{display:block;max-width:856px;max-height:920px;border-radius:20px;object-fit:contain}
.leg{margin-top:44px;font-size:36px;line-height:1.38;text-align:center;max-width:860px;color:#3a3732}
.cta{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:22px}
.pill{background:var(--carvao);color:var(--marfim);font-family:Sora;font-weight:500;font-size:34px;padding:22px 44px;border-radius:999px}
.logo{height:62px}
</style></head>
<body>
<div class="fundo" style="background-image:url('{{imagem}}')"></div><div class="veu"></div>
<div class="pg">
  <div class="kicker">{{kicker}}</div>
  <h1>{{titulo}}</h1>
  <div class="card"><img src="{{imagem}}"></div>
  <div class="leg">{{legenda}}</div>
  <div class="cta"><div class="pill">{{cta}}</div><img class="logo" src="assets/logo-horizontal.png"></div>
</div>
</body></html>
